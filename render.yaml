services:
  - type: web
    name: bugflow-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python init_live_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugflow-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: bugflow-db
    databaseName: bugfinding
    user: bugflow_user
    plan: free
    region: oregon
